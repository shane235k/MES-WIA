[package]
name = "operator-client"
version = "1.0.0"
description = "Shop Floor Operator Desktop Terminal"
authors = ["Adaptive MES Team"]
edition = "2021"

[lib]
name = "operator_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
